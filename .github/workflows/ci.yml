name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopdesk
          POSTGRES_PASSWORD: shopdesk
          POSTGRES_DB: shopdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopdesk" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://shopdesk:shopdesk@localhost:5432/shopdesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests evals
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shopdesk:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name shopdesk -p 8000:8000             -e ENV=dev -e OPENAI_API_KEY=sk-test -e QDRANT_URL=:memory:             -e EMBEDDING_PROVIDER=local -e FALLBACK_PROVIDER=none             -e DATABASE_URL=sqlite:///data/shopdesk.db shopdesk:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/healthz && break || sleep 2
          done
          curl -fsS localhost:8000/healthz
          curl -fsS -o /dev/null localhost:8000/widget/shopdesk-widget.js
          curl -fsS localhost:8000/dev/storefront | grep -q "shopdesk-widget.js"
          docker exec shopdesk test -f /app/data/shopdesk.db
      - if: failure()
        run: docker logs shopdesk
