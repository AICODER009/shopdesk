[project]
name = "shopdesk"
version = "0.1.0"
description = "Customer-support agent for e-commerce: grounded answers from the KB, live order lookups, Zendesk handoff."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "qdrant-client>=1.13",
    "fastembed>=0.6",
    "httpx>=0.28",
    "langfuse>=3.0",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "cryptography>=43",
    "openai>=3.37.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real external services, skipped unless SHOPDESK_LIVE_TESTS=1",
    "postgres: needs TEST_DATABASE_URL (docker compose up -d postgres)",
]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]

[tool.coverage.run]
source = ["shopdesk"]
branch = true
omit = ["src/shopdesk/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
